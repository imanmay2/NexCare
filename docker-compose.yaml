services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nexcare_backend_dev
    working_dir: /app
    ports:
      - "8090:8090"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: nexcare_frontend_dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    depends_on:
      - backend